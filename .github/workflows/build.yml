# Каждый пуш и пул-реквест: сборка в Fedora и проверка QML
name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости
        run: dnf -y -q install cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel
      - name: Сборка
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          ./build/shelf --version
      - name: qmllint
        run: /usr/lib64/qt6/bin/qmllint -I build qml/*.qml
