# Каждый пуш и пул-реквест: сборка в Fedora, тесты, проверка QML и пакет Nix
name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v7
      - name: Зависимости
        run: dnf -y -q install cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel python3
      - name: Сборка
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DSHELF_TESTS=ON
          cmake --build build
          ./build/shelf --version
      - name: Тесты
        run: ctest --test-dir build --output-on-failure
      - name: qmllint
        run: /usr/lib64/qt6/bin/qmllint -I build qml/*.qml

  # Пакет Nix из исходников ветки: забытые в lib.fileset файлы видны до релиза, а не на теге
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Сборка flake
        run: |
          nix flake check
          nix build .#shelf -L
          ls result/libexec result/share/xdg-desktop-portal/portals
          QT_QPA_PLATFORM=offscreen result/bin/shelf --version
